<!DOCTYPE html>
<html>
<head>
  <title>MCSF ID Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>MCSF ID Card Generator</h2>

  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="role" placeholder="Designation">
  <input type="text" id="phone" placeholder="Phone">
  <input type="file" id="photo">

  <button onclick="generateID()">Generate ID</button>
  <button onclick="downloadPDF()">Download PDF</button>

  <div id="card">
    <div class="card-inner">
      <img src="logo.png" class="logo">

      <img id="previewPhoto" class="photo">

      <h3 id="cardName">Name</h3>
      <p id="cardRole">Role</p>
      <p id="cardPhone">Phone</p>
      <p id="cardId">ID: MCSF-0000</p>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
